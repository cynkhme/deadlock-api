[package]
name = "deadlock-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Unofficial client for the deadlock-api.com Deadlock match data API"
repository = "https://github.com/cynkhme/deadlock-api"
documentation = "https://docs.rs/deadlock-api"
readme = "README.md"
keywords = ["deadlock", "api", "client", "valve"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["blocking", "rustls"]
blocking = ["dep:ureq"]
async = ["dep:reqwest", "dep:tokio"]
rustls = ["ureq?/rustls", "ureq?/platform-verifier", "reqwest?/rustls"]
native-tls = ["ureq?/native-tls", "reqwest?/native-tls"]
fs-cache = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"
bytes = "1"
serde_urlencoded = "0.7"
log = "0.4"
httpdate = "1"
ureq = { version = "3", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "match_summary"
required-features = ["blocking"]

[[example]]
name = "async_match_summary"
required-features = ["async"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
